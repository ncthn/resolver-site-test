<!doctype html>
<html lang="en">
<head>
  <!-- App Bridge is injected ONLY inside a real embedded admin frame.
       At top level it treats ?shop= (and ?host=) as an instruction to navigate
       to that host, with no validation — loading it unconditionally turned every
       page of both hosts into an unauthenticated open redirect, and bounced
       merchants out of onboarding whose return URLs carry ?shop=.
       document.write during head parsing is still parser-inserted, which is what
       App Bridge requires to boot window.shopify. -->
  <script>
    (function () {
      try {
        if (window.self === window.top) return;            // not framed -> never load
        var p = new URLSearchParams(window.location.search);
        if (!p.get('host') && !p.get('embedded')) return;  // framed but not a Shopify admin embed
        document.write(
          '<meta name="shopify-api-key" content="0c5c39e22383398b6fd46380266db57f">' +
          '<scr' + 'ipt src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></scr' + 'ipt>'
        );
      } catch (e) { /* never block the page */ }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resolver, supervised AI support for Shopify</title>
  <meta name="description" content="Resolver drafts every support reply from the real Shopify order, in the customer's language, and sends nothing until a lane earns it. Chargeback and legal language always goes to a human." />
  <link rel="icon" href="/logo/recolor/oct-black-t.png" />
